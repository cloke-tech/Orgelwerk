name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
          - os: windows-2022
            name: Windows
          - os: ubuntu-24.04
            name: Linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev libcurl4-openssl-dev

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DORGEL_BUILD_CLI=ON
          elif [ "$RUNNER_OS" == "macOS" ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        # Verovio's humlib.cpp needs a lot of memory; more parallel jobs run out of RAM on CI runners
        run: cmake --build build --config Release --parallel 2

      - name: Test (import, engrave, export, render)
        shell: bash
        run: |
          CLI=$(find build -type f \( -name orgelcli -o -name orgelcli.exe \) | head -1)
          mkdir -p out
          "$CLI" export tests/smoke.mid out/smoke.musicxml out/smoke.mid out/smoke.mei out/smoke.abc out/smoke.ly out/smoke.pdf out/smoke.wav | tee out/log.txt
          ! grep -q FAILED out/log.txt

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          ART=build/Orgelwerk_artefacts/Release
          [ -d "$ART" ] || ART=build/Orgelwerk_artefacts
          cp -R "$ART"/Standalone/* dist/ 2>/dev/null || true
          cp -R "$ART"/VST3 dist/ 2>/dev/null || true
          cp -R "$ART"/AU dist/ 2>/dev/null || true
          cp -R "$ART"/LV2 dist/ 2>/dev/null || true
          cp README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Orgelwerk-${{ matrix.name }}
          path: dist
